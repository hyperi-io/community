# Thresholds for the idea scorer. A thumbs-up counts only from an account that meets both minimums.

category = "Ideas"
min_account_days = 90
min_contributions_last_year = 5

# A thumbs-up from a customer's GitHub login counts this many times.
# The logins come from the CUSTOMER_GITHUB_LOGINS secret, never this file, because the repo is public.
customer_weight = 3

# An idea scoring this or more gets one tracked issue with this label, which pm sync puts on the board.
issue_threshold = 10
issue_label = "community-idea"

# Thumbs-up votes on open public issues across the org are scored the same way into this org issue field.
score_field = "Community score"
# EdgeStream Hub and the repos its team owns are never scored.
exclude_prefixes = ["edgestream-", "edge-"]
exclude_repos = [
  "flow-collector",
  "dev-office365-audit-log-collector",
  "collector-api",
  "collector-dashboard",
  "collector-aws-vpn-client",
  "vflow",
]
