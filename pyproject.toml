[project]
name = "hyperi-community"
version = "0.0.0"
description = "Scores Idea discussions in hyperi-io/community"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "D", "N"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D103", "E501"]
